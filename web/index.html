<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_project">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>my_project</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt@latest/zego-uikit-prebuilt.js"></script>
  <script>
    var localStream = null;
    function startLocalVideo(containerId) {
      var container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";
      var video = document.createElement("video");
      video.autoplay = true;
      video.muted = true;
      video.style.width = "100%";
      video.style.height = "100%";
      video.style.objectFit = "cover";
      video.style.borderRadius = "16px";
      container.appendChild(video);
      
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          localStream = stream;
          video.srcObject = stream;
        })
        .catch(function(err) {
          console.error("Camera access failed: ", err);
        });
    }

    function stopLocalVideo() {
      if (localStream) {
        localStream.getTracks().forEach(function(track) {
          track.stop();
        });
        localStream = null;
      }
    }

    window.addEventListener('trigger_razorpay', function(event) {
      var options = JSON.parse(event.detail);
      openRazorpayWeb(options);
    });

    function openRazorpayWeb(options) {
      options.handler = function(response) {
        var event = new CustomEvent('razorpay_success', {
          detail: JSON.stringify({
            payment_id: response.razorpay_payment_id,
            order_id: response.razorpay_order_id,
            signature: response.razorpay_signature
          })
        });
        window.dispatchEvent(event);
      };
      options.modal = {
        ondismiss: function() {
          var event = new CustomEvent('razorpay_dismiss');
          window.dispatchEvent(event);
        }
      };
      var rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
